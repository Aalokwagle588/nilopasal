services:
  # Nilopasal Python FastAPI Backend API
  - type: web
    name: nilopasal-api
    runtime: python
    rootDir: fastapi_backend
    plan: free
    region: singapore # Closest low-latency region to Nepal
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app -k uvicorn.workers.UvicornWorker -b 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: nilopasal-db
          property: connectionString
      - key: COOKIE_SECURE
        value: "true"
      - key: SESSION_COOKIE_NAME
        value: "__Host-nilopasal_session"
      - key: SESSION_TTL_DAYS
        value: "30"
      - key: CORS_ORIGINS
        value: "https://nilopasal.com,https://www.nilopasal.com,https://api.nilopasal.com"
      - key: SECRET_KEY
        generateValue: true

databases:
  # Managed PostgreSQL 16 Database
  - name: nilopasal-db
    databaseName: nilopasal
    user: nilopasal_user
    plan: free
    region: singapore
    postgresMajorVersion: 16
